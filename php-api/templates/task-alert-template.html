<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ALERT_TITLE}} - DN TaskFlow</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #e2e8f0;
    }
    .wrapper {
      max-width: 580px;
      margin: 40px auto;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .header {
      padding: 32px 32px 20px;
      text-align: center;
      background: linear-gradient(180deg, rgba(0, 128, 250, 0.18) 0%, rgba(17, 24, 39, 0) 100%);
    }
    .logo-container {
      margin-bottom: 16px;
      text-align: center;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 4px;
    }
    .content {
      padding: 24px 32px 32px;
    }
    .text {
      font-size: 14px;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 20px;
    }
    .task-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 24px;
    }
    .task-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      margin-right: 6px;
    }
    .badge-priority { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .badge-due { background: rgba(245, 158, 11, 0.2); color: #fde68a; }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      background: #0080fa;
      color: #ffffff !important;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(0, 128, 250, 0.4);
    }
    .app-links-box {
      margin: 24px 0 16px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      text-align: center;
    }
    .link-btn {
      display: inline-block;
      margin: 4px 6px;
      padding: 9px 18px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 8px;
    }
    .link-web {
      background: #0080fa;
      color: #ffffff !important;
    }
    .link-desktop {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff !important;
    }
    .footer {
      padding: 18px 32px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      text-align: center;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <div class="logo-container">
        <img src="https://app.drunall.com/taskflow/dn_taskflow_logo.png" alt="DN TaskFlow" width="180" style="display: inline-block; max-height: 46px; border: 0; outline: none;" />
      </div>
      <h1 class="title">{{ALERT_TITLE}}</h1>
    </div>
    <div class="content">
      <p class="text">Hello <strong>{{USER_NAME}}</strong>,<br><br>
      {{ALERT_MESSAGE}}</p>
      
      <div class="task-card">
        <div class="task-title">{{TASK_TITLE}}</div>
        <div>
          <span class="badge badge-priority">Priority: {{TASK_PRIORITY}}</span>
          <span class="badge badge-due">Due: {{TASK_DUE}}</span>
        </div>
      </div>

      <div style="text-align: center; margin-bottom: 24px;">
        <a href="{{APP_URL}}#task={{TASK_ID}}" class="btn">View Task in DN TaskFlow</a>
      </div>

      <div class="app-links-box">
        <div style="font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 10px;">Access DN TaskFlow Anywhere:</div>
        <a href="https://app.drunall.com/taskflow" class="link-btn link-web">🌐 Open Web Portal</a>
        <a href="http://app.drunall.com/taskflow/downloads/DN%20TaskFlow-Setup.exe" class="link-btn link-desktop">💻 Download Desktop App (.exe)</a>
      </div>
    </div>
    <div class="footer">
      &copy; 2026 DN TaskFlow by Drunall Technologies. All rights reserved.
    </div>
  </div>
</body>
</html>
